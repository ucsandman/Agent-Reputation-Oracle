services:
  oracle:
    build: .
    ports:
      - "3402:3402"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/reputation.db
    volumes:
      - oracle-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3402/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oracle-data:
